_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Every earthquake near a city in its own calendar year"
summary: "Ask for earthquakes near Tokyo, Manila, Jakarta, Kathmandu, Lima, Honolulu, Reykjavik or Taipei in one year (1990-2024), with a minimum magnitude (4.5-8.0) and a radius (50-800 km). Example: 'Quakes of magnitude 6.0+ within 300 km of Kathmandu in 2015.' An agent searches the live USGS catalog in the city's local year, and a verifier recomputes the answer."
highlights:
  - "Live data from the official USGS Earthquake Catalog"
  - "Local years done right: Tokyo's New Year starts at 15:00 UTC the day before"
  - "Every answer is checked against the catalog data the agent read"
steps:
  - "Ask, e.g. which quakes of magnitude 5.0 or more struck within 300 km of Tokyo in 2005"
  - "The agent looks up the city, searches the catalog and picks the largest and the closest"
  - "It submits the events, and the verdict card shows whether they are exactly right"
